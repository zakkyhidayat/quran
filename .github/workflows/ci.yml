# Setiap push dan pull request: integritas teks Qur'an, teks antarmuka, unit test, dan build debug.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Qur'an content and strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Integritas teks Qur'an (jumlah, halaman, sidik jari SHA-256)
        run: python tools/verify_quran.py
      - name: Teks antarmuka (kunci, placeholder, apostrof)
        run: python tools/check_strings.py

  android:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Font halaman tidak ada di git; build debug tetap berjalan (halaman memakai font bawaan), cukup untuk tes.
      # assembleLiteRelease (tanpa tanda tangan) menguji R8 pada varian lite sebelum workflow rilis.
      - run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:lintGithubDebug :app:assembleGithubDebug :app:assembleLiteDebug :app:assembleLiteRelease
      # Varian lite harus memakai quran.db ramping hasil tools/build_lite_db.py, bukan salinan penuh (sekitar 12 MB).
      - name: quran.db lite ramping
        run: |
          size=$(unzip -l app/build/outputs/apk/lite/debug/app-lite-debug.apk assets/quran.db | awk 'NR==4 {print $1}')
          echo "assets/quran.db di APK lite: $size byte"
          test "$size" -gt 1000000 && test "$size" -lt 8000000
