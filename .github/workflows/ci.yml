# Setiap push dan pull request: integritas teks Qur'an, teks antarmuka, unit test, dan build debug.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Qur'an content and strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Integritas teks Qur'an (jumlah, halaman, sidik jari SHA-256)
        run: python tools/verify_quran.py
      - name: Teks antarmuka (kunci, placeholder, apostrof)
        run: python tools/check_strings.py

  android:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Ambil paket font mushaf
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-assets --pattern page-fonts.zip --dir "$RUNNER_TEMP"
      # Jalankan suite JVM dan lint pada kedua flavor agar kode bersama dinilai setara; fitur eksklusif full tetap diuji di flavor github.
      # assembleLiteRelease (tanpa tanda tangan) menguji R8 pada varian lite sebelum workflow rilis.
      - run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testLiteDebugUnitTest :app:lintGithubDebug :app:lintLiteDebug :app:assembleGithubDebug :app:assembleLiteDebug :app:assembleLiteRelease :app:buildLiteDb
      - name: Integritas database full dan Lite
        run: |
          python tools/verify_quran.py --db app/src/main/assets/quran.db
          python tools/verify_quran.py --db app/build/quran-data/lite/quran.db
      - name: Pastikan database tidak dibundel di APK
        run: |
          ! unzip -Z1 app/build/outputs/apk/github/debug/app-github-debug.apk | grep -Fx 'assets/quran.db'
          ! unzip -Z1 app/build/outputs/apk/lite/debug/app-lite-debug.apk | grep -Fx 'assets/quran.db'
          ! unzip -Z1 app/build/outputs/apk/github/debug/app-github-debug.apk | grep -E '^assets/fonts/p[0-9]+\.ttf$'
          ! unzip -Z1 app/build/outputs/apk/lite/debug/app-lite-debug.apk | grep -E '^assets/fonts/p[0-9]+\.ttf$'
      - name: Manifest database rilis
        run: |
          gzip -n -c app/src/main/assets/quran.db > "$RUNNER_TEMP/quran-full.db.gz"
          gzip -n -c app/build/quran-data/lite/quran.db > "$RUNNER_TEMP/quran-lite.db.gz"
          python tools/create_quran_manifest.py --full "$RUNNER_TEMP/quran-full.db.gz" --lite "$RUNNER_TEMP/quran-lite.db.gz" --fonts "$RUNNER_TEMP/page-fonts.zip" --output "$RUNNER_TEMP/quran-data.json"
