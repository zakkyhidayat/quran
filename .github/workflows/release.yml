# Rilis bertanda tangan saat tag vX.Y.Z di-push, atau dari tab Actions ("Run workflow", isi versi): APK GitHub, APK Lite,
# dan AAB Play. Tidak ada pembaru dalam aplikasi.
# Kebutuhan sekali saja: lihat docs/RELEASING.md (secret keystore dan rilis `build-assets` berisi font halaman).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Rilis tanpa push tag dari komputer: workflow membuat tag di commit main terbaru, lalu membangun seperti biasa.
  workflow_dispatch:
    inputs:
      tag:
        description: "Versi baru, misalnya v0.3.0"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe --tags menentukan versionName/versionCode

      - name: Buat tag (hanya dari tab Actions)
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versi harus berbentuk vX.Y.Z, bukan $TAG"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::Tag $TAG sudah ada"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # Tag dari GITHUB_TOKEN tidak memicu workflow ini lagi, jadi tidak ada rilis ganda.
          git push origin "$TAG"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Periksa secret penandatanganan
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 belum diisi. Lihat docs/RELEASING.md."
            exit 1
          fi

      - name: Pasang keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Ambil font halaman (tidak disimpan di git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-assets --pattern page-fonts.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/page-fonts.zip" -d app/src/main/assets/fonts
          test "$(ls app/src/main/assets/fonts/p*.ttf | wc -l)" -eq 604

      - name: Build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleGithubRelease :app:bundlePlayRelease :app:assembleLiteRelease

      - name: Terbitkan rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/quran-${TAG}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "out/quran-${TAG}-play.aab"
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "out/quran-lite-${TAG}.apk"
          gh release create "$TAG" out/quran-${TAG}.apk --title "$TAG" --generate-notes
          # APK lite diunggah sesudahnya agar APK penuh tetap aset pertama: versi 0.2.0 masih punya pembaru dalam aplikasi
          # yang mengambil APK pertama di rilis tanpa menyaring nama.
          gh release upload "$TAG" out/quran-lite-${TAG}.apk
          # AAB untuk Play Console disimpan sebagai artefak workflow, bukan aset rilis publik.

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: out/*.aab
