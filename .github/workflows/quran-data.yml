# Perbarui satu rilis data stabil tanpa menerbitkan APK baru. Jalankan setelah data QUL diperbarui dan diverifikasi.
name: Qur'an data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Ambil font mushaf yang tidak berubah
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download quran-data --pattern page-fonts.zip --dir "$RUNNER_TEMP"

      - name: Verifikasi data dan bangun varian Lite
        run: |
          python tools/verify_quran.py --db app/src/main/assets/quran.db
          ./gradlew --no-daemon :app:buildLiteDb
          python tools/verify_quran.py --db app/build/quran-data/lite/quran.db

      - name: Buat katalog data
        run: |
          mkdir -p out
          gzip -n -c app/src/main/assets/quran.db > out/quran-full.db.gz
          gzip -n -c app/build/quran-data/lite/quran.db > out/quran-lite.db.gz
          cp "$RUNNER_TEMP/page-fonts.zip" out/page-fonts.zip
          python tools/create_quran_manifest.py --full out/quran-full.db.gz --lite out/quran-lite.db.gz --fonts out/page-fonts.zip --output out/quran-data.json

      - name: Timpa aset rilis Qur'an data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload quran-data out/quran-full.db.gz out/quran-lite.db.gz out/page-fonts.zip out/quran-data.json --clobber
